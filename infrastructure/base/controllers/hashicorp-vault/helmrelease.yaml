apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hashicorp-vault
  namespace: hashicorp-vault
spec:
  interval: 30m
  chart:
    spec:
      chart: hashicorp-vault
      version: "0.34.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp-vault
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3