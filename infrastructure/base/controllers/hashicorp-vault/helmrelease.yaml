apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hashicorp-vault
  namespace: hashicorp-vault
spec:
  interval: 30m
  chart:
    spec:
      chart: vault
      version: "0.34.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp-vault
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    server:
      dataStorage:
        enabled: true
        size: 10Gi
        storageClass: local-path
      service:
        type: LoadBalancer
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          cert-manager.io/cluster-issuer: letsencrypt
        hosts:
          - host: ${VAULT_HOST}
            paths:
              - /
        tls:
          - secretName: vault-tls
            hosts:
              - ${VAULT_HOST}